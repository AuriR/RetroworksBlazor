<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroWorks</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RetroWorks.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Shown immediately (plain HTML) while the WASM runtime downloads;
             removed by the script at the bottom once Blazor has booted. -->
        <div class="boot-loading"><span class="boot-text">LOADING</span><span class="boot-cursor">&#160;</span></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Remove the static "LOADING" prompt as soon as Blazor renders its first content.
        (function () {
            var app = document.getElementById('app');
            var boot = app.querySelector('.boot-loading');
            if (!boot) return;
            new MutationObserver(function () {
                boot.remove();
                this.disconnect();
            }).observe(app, { childList: true });
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
